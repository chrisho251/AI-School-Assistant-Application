[project]
name = "asag"
version = "0.1.0"
description = "AI School Assistant & Grader — NotebookLM-style platform for education"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Chris" }]

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "rich>=13.9",
    "typer>=0.12",
    # DB
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pgvector>=0.3",
    # Supabase
    "supabase>=2.7",
    # Ingestion
    "docling>=2.0",
    "nbformat>=5.10",
    "tiktoken>=0.8",
    "pillow>=10.4",
    # LLM
    "litellm>=1.50",
    "google-generativeai>=0.8",
    # Observability
    "langfuse>=2.50",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
]
ui = [
    "streamlit>=1.39",
]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "mypy>=1.11",
    "pre-commit>=4.6",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asag"]

[tool.ruff]
line-length = 100
target-version = "py312"
# venv, pycache or sql are not need to scan, it is not python file
exclude = [".venv", "__pycache__", "*.sql"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test files: @patch injects mock args that aren't always referenced directly
"tests/**/*.py" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"
markers = [
    "integration: marks tests that hit real external services (Postgres, TEI); deselect with -m 'not integration'",
]
filterwarnings = [
    # LiteLLM internal bug: LoggingWorker leaves unawaited coroutines when the
    # asyncio event loop closes at end of each test. Not our code — suppress it.
    "ignore:coroutine 'Logging.async_success_handler' was never awaited:RuntimeWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
